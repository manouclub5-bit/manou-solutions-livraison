<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devenir livreur — MANOU SOLUTIONS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
<header class="bg-emerald-600 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><a href="index.html" class="font-black">← MANOU SOLUTIONS</a><span>Devenir livreur</span></div></header>
<main class="max-w-5xl mx-auto p-5 py-12">
<div class="grid md:grid-cols-2 gap-7">
<section class="bg-white rounded-2xl shadow p-7">
<h1 class="text-3xl font-black mb-4">Rejoignez nos livreurs 🛵</h1>
<p class="mb-6">Travaillez dans le Grand Lomé avec MANOU SOLUTIONS.</p>
<ul class="space-y-3"><li>✓ Missions de livraison et courses</li><li>✓ Horaires flexibles</li><li>✓ Suivi des courses</li><li>✓ Commission calculée selon les livraisons</li></ul>
</section>
<section class="bg-white rounded-2xl shadow p-7">
<h2 class="text-2xl font-black mb-5">Postuler</h2>
<form id="driverForm" class="space-y-4">
<input id="name" required class="w-full border rounded-xl p-3" placeholder="Nom et prénom">
<input id="phone" required class="w-full border rounded-xl p-3" placeholder="WhatsApp">
<input id="area" required class="w-full border rounded-xl p-3" placeholder="Quartier">
<select id="vehicle" class="w-full border rounded-xl p-3"><option>Moto</option><option>Tricycle</option><option>Voiture</option></select>
<button class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black">ENVOYER MA CANDIDATURE</button>
</form>
</section>
</div>
</main>
<script>
document.getElementById("driverForm").addEventListener("submit",e=>{
 e.preventDefault();
 const n=document.getElementById("name").value,t=document.getElementById("phone").value,a=document.getElementById("area").value,v=document.getElementById("vehicle").value;
 const msg=encodeURIComponent(`CANDIDATURE LIVREUR — MANOU SOLUTIONS\nNom: ${n}\nWhatsApp: ${t}\nQuartier: ${a}\nVéhicule: ${v}`);
 window.open("https://wa.me/22872652802?text="+msg,"_blank");
});
</script>
</body></html>
